<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>HeadAutoaim Injector</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Segoe UI', monospace;
    }

    body {
      margin: 0;
      background: #101010;
      color: #ddd;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    header {
      padding: 1rem 2rem;
      background: #181818;
      border-bottom: 1px solid #333;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h1 {
      font-size: 1.3rem;
      color: #fff;
      letter-spacing: 0.5px;
    }

    main {
      flex: 1;
      padding: 2rem;
      display: grid;
      grid-template-columns: 1fr;
      gap: 1.5rem;
    }

    .card {
      background: #1b1b1b;
      border: 1px solid #2a2a2a;
      border-radius: 0.8rem;
      padding: 1.5rem;
      box-shadow: 0 0 8px rgba(0,0,0,0.4);
    }

    .card h2 {
      margin-top: 0;
      font-size: 1.1rem;
      color: #bbb;
      border-bottom: 1px solid #333;
      padding-bottom: 0.4rem;
    }

    textarea {
      width: 100%;
      height: 260px;
      background: #111;
      color: #aaa;
      border: 1px solid #333;
      border-radius: 0.4rem;
      padding: 1rem;
      font-size: 0.9rem;
      resize: none;
    }

    .action-btn {
      width: 100%;
      margin-top: 1rem;
      padding: 0.9rem;
      background: #2e2e2e;
      color: #fff;
      font-size: 1rem;
      font-weight: bold;
      border: none;
      border-radius: 0.5rem;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    .action-btn:hover {
      background: #3b3b3b;
    }

    .terminal {
      background: #000;
      color: #4caf50;
      padding: 1rem;
      border-radius: 0.5rem;
      font-size: 0.85rem;
      height: 180px;
      overflow-y: auto;
      border: 1px solid #2a2a2a;
      margin-top: 1rem;
    }

    .progress-container {
      margin-top: 1rem;
      width: 100%;
      height: 10px;
      background: #222;
      border-radius: 0px;
      overflow: hidden;
      display: none;
      border: 1px solid #333;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(to right, #4caf50, #8bc34a);
      border-radius: 0px;
      text-align: center;
      color: #fff;
      font-size: 0.7rem;
      line-height: 10px;
    }

    footer {
      padding: 1rem 2rem;
      background: #181818;
      text-align: center;
      font-size: 0.75rem;
      color: #666;
      border-top: 1px solid #2a2a2a;
    }

    @media (min-width: 700px) {
      main {
        grid-template-columns: 1fr 1fr;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>HeadAutoaim Injector</h1>
    <div>v1.3.7</div>
  </header>

  <main>
    <div class="card">
      <h2>HeadAutoaim Coding</h2>
      <textarea readonly id="Base64Config"></textarea>
    </div>

    <div class="card">
      <h2>Injection Console</h2>
      <button class="action-btn" onclick="injectConfig()">INJECT CONFIG</button>
      <div class="terminal" id="terminalLog">Aplicar a Execução do Bypass?</div>
      <div class="progress-container" id="progressContainer">
        <div class="progress-bar" id="progressBar">0%</div>
      </div>
    </div>
  </main>

  <footer>
    CrazySensi System © 2024 — All Rights Reserved
  </footer>

  <script>
    function injectConfig() {
      const progressContainer = document.getElementById("progressContainer");
      const progressBar = document.getElementById("progressBar");
      const terminal = document.getElementById("terminalLog");
      const button = document.querySelector(".action-btn");

      // Reset
      progressBar.style.width = "0%";
      progressBar.textContent = "0%";
      terminal.innerHTML = "";
      button.disabled = true;
      button.textContent = "Aplicando...";
      terminal.style.color = "#4caf50"; // Verde

      progressContainer.style.display = "block";

      let progress = 0;
      const interval = setInterval(() => {
        if (progress >= 100) {
          clearInterval(interval);
          showBypassLines();
          button.textContent = "Aplicado";
          button.style.backgroundColor = "#1a7f2e";
          button.disabled = false;
          return;
        }
        progress += 2;
        progressBar.style.width = progress + "%";
        progressBar.textContent = progress + "%";
      }, 100);
    }

    function showBypassLines() {
      const terminal = document.getElementById("terminalLog");
      const lines = [
        ">> Initializing injection engine...",
        ">> Loading configuration file...",
        ">> Validating structure...",
        ">> Injecting data packet...",
        ">> Verifying memory integrity...",
        ">> Finalizing injection...",
        ">> Inject Success — Path: /Game/Core/HeadAutoaim.dll"
      ];

      let i = 0;
      const lineInterval = setInterval(() => {
        if (i >= lines.length) {
          clearInterval(lineInterval);
          return;
        }
        terminal.innerHTML += lines[i] + "<br/>";
        terminal.scrollTop = terminal.scrollHeight;
        i++;
      }, 400); // intervalo entre as linhas
    }
  </script>
</body>
</html>
